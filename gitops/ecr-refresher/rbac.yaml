apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ecr-refresher
  namespace: status-page
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ecr-refresher
  namespace: status-page
subjects:
  - kind: ServiceAccount
    name: ecr-refresher
    namespace: status-page
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: ecr-refresher
