---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-mcp-sa
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-mcp-readonly
rules:
  - apiGroups: ["", "apps", "batch", "extensions", "networking.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-mcp-binding
subjects:
  - kind: ServiceAccount
    name: ai-mcp-sa
    namespace: monitoring
roleRef:
  kind: ClusterRole
  name: ai-mcp-readonly
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-mcp-bastion
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-mcp-bastion
  template:
    metadata:
      labels:
        app: ai-mcp-bastion
    spec:
      serviceAccountName: ai-mcp-sa
      containers:
        - name: mcp-runner
          image: node:20-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              apk add --no-cache curl
              curl -LO "https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl"
              chmod +x kubectl && mv kubectl /usr/local/bin/
              echo "AI Bastion is ready."
              sleep infinity