apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecr-refresher
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/alondudi/status-page-DevOps.git"
    targetRevision: main
    path: gitops/ecr-refresher
  destination:
    server: "https://kubernetes.default.svc"
    namespace: status-page
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
